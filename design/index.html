<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World Acceptance 3</title>
  <style>
    :root {
      --background: #FFFFFF;
      --text: #000000;
      --button: #2563EB;
      --button-hover: #1D4ED8;
      --focus: #2563EB;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 560px;
    }

    .greeting-section {
      min-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(48px, 10vw, 88px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    form {
      width: 100%;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 48px;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--text);
      border-radius: 0;
      appearance: none;
      -webkit-appearance: none;
      background: var(--background);
      color: var(--text);
      font: inherit;
      font-size: 18px;
      line-height: 48px;
    }

    button {
      height: 48px;
      padding: 0 22px;
      border: 1px solid var(--button);
      border-radius: 0;
      background: var(--button);
      color: #FFFFFF;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--button-hover);
      border-color: var(--button-hover);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .greeting-section {
        min-height: calc(100vh - 32px);
      }

      form {
        flex-direction: column;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="greeting-section" aria-labelledby="greeting-heading">
      <h1 id="greeting-heading">Hello, World!</h1>
      <form id="greeting-form">
        <label for="greeting-input">Greeting</label>
        <input id="greeting-input" name="greeting" type="text" value="Hello, World!" autocomplete="off" required>
        <button type="submit">Save</button>
      </form>
    </section>
  </main>
  <script>
    (function () {
      var heading = document.getElementById('greeting-heading');
      var form = document.getElementById('greeting-form');
      var input = document.getElementById('greeting-input');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var nextGreeting = input.value.trim();

        if (!nextGreeting) {
          input.focus();
          return;
        }

        heading.textContent = nextGreeting;
        input.value = nextGreeting;
      });
    }());
  </script>
</body>
</html>
